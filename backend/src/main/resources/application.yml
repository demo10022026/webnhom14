server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
      mail.smtp.timeout: ${MAIL_SMTP_TIMEOUT:10000}
      mail.smtp.writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}

app:
  email:
    provider: ${MAIL_PROVIDER:smtp}
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:}
      sender-name: ${BREVO_SENDER_NAME:ShopVN}
    resend:
      api-key: ${RESEND_API_KEY:}
      from-email: ${RESEND_FROM_EMAIL:}
      from-name: ${RESEND_FROM_NAME:ShopVN}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

  cors:
    allowed-origins:
      - ${CORS_ORIGIN_1:http://localhost:5173}
      - ${CORS_ORIGIN_2:http://localhost:3000}
      - ${CORS_ORIGIN_3:https://enchanting-marigold-597279.netlify.app}
      - https://*.trycloudflare.com

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  upload:
    local-dir: uploads
    use-local: false
    base-url: ${BASE_URL:http://localhost:8080}

  payment:
    sepay:
      enabled: ${SEPAY_ENABLED:false}
      dev-simulate-enabled: ${SEPAY_DEV_SIMULATE_ENABLED:false}
      bank-name: ${SEPAY_BANK_NAME:}
      account-number: ${SEPAY_ACCOUNT_NUMBER:}
      account-holder: ${SEPAY_ACCOUNT_HOLDER:}
      api-key: ${SEPAY_WEBHOOK_API_KEY:}
      qr-template: ${SEPAY_QR_TEMPLATE:compact}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.security: INFO
