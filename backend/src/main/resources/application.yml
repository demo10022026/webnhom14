server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null

app:
  email:
    from-email: ${MAIL_FROM_EMAIL:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:ShopVN}
    mailjet:
      api-key: ${MAILJET_API_KEY:${MAIL_USERNAME:}}
      secret-key: ${MAILJET_SECRET_KEY:${MAIL_PASSWORD:}}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

  cors:
    allowed-origins:
      - ${CORS_ORIGIN_1:http://localhost:5173}
      - ${CORS_ORIGIN_2:http://localhost:3000}
      - ${CORS_ORIGIN_3:https://enchanting-marigold-597279.netlify.app}
      - https://*.trycloudflare.com

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  upload:
    local-dir: uploads
    use-local: false
    base-url: ${BASE_URL:http://localhost:8080}

  payment:
    sepay:
      enabled: ${SEPAY_ENABLED:false}
      dev-simulate-enabled: ${SEPAY_DEV_SIMULATE_ENABLED:false}
      bank-name: ${SEPAY_BANK_NAME:}
      account-number: ${SEPAY_ACCOUNT_NUMBER:}
      account-holder: ${SEPAY_ACCOUNT_HOLDER:}
      api-key: ${SEPAY_WEBHOOK_API_KEY:}
      qr-template: ${SEPAY_QR_TEMPLATE:compact}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.security: INFO
